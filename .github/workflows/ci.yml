name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7
      - name: swift-format
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: shellcheck
        run: |
          apt-get update -qq && apt-get install -y -qq shellcheck >/dev/null
          shellcheck scripts/*.sh

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7
      - name: Test PrinterKit
        run: swift test --parallel

  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test --parallel
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Render screenshots
        run: swift run -c release snapshots build/snapshots
      - name: Package
        run: ditto -c -k --keepParent build/Skener.app build/Skener.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Skener
          path: build/Skener.zip
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/snapshots
