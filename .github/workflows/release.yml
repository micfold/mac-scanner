name: Release

# Push a tag like v0.4.0 to build the app and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test --parallel
      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/Skener.app "build/Skener-${GITHUB_REF_NAME}.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "build/Skener-${GITHUB_REF_NAME}.zip" --generate-notes --verify-tag
