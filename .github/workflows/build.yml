name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/Skener.app build/Skener.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Skener
          path: build/Skener.zip

  linux-core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test ScanCore
        run: swift test
